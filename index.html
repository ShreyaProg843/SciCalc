<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <!-- <style>
      </style> -->
  </head>
</head>
<body>
    <div class ="container">
        <h1 class="text-center mt-3">Scientific Calculator</h1>
        <div class="row">
            <div class="col-12 offset-md-3 col-md-6 "><div class="card"> <div class="card-body">
                <input id="calc-display"
                readonly
                 class="form-control form-control-lg text-end" 
                 type="text"
                  aria-label=".form-control-lg example">
                  <div class="row gx-1">
                      <div class="col-3">
                                <button type="button" class="btn btn-neon-function w-100 mt-2" data-mode="deg">DEG</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-neon-function w-100 mt-2" data-mode="rad">RAD</button>
                            </div>
                    <div class="col-3">
                        <!-- <button type="button" class="btn btn-light w-100 mt-2 border">(</button> -->
                        <button type="button" class="btn btn-neon-function w-100 mt-2">AC</button>
                        </div>
                        <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">)</button> -->
                          <button type="button" class="btn  btn-neon-operator w-100 mt-2">%</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">%</button> -->
                          <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">7</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">AC</button> -->
                          <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">8</button>
                           </div>
                           <div class="col-3">
                        <!-- <button type="button" class="btn btn-light w-100 mt-2 border">7</button> -->
                         <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">9</button>
                        </div>
                        <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">8</button> -->
                          <button type="button" class="btn btn-calc btn-neon-operator w-100 mt-2">+</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">9</button> -->
                           <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">4</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">÷</button> -->
                          <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">5</button>
                           </div>
                           <div class="col-3">
                        <!-- <button type="button" class="btn btn-light w-100 mt-2 border">4</button> -->
                         <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">6</button>
                        </div>
                        <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">5</button> -->
                          <button type="button" class="btn btn-calc btn-neon-operator w-100 mt-2">-</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">6</button> -->
                          <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">1</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">×</button> -->
                          <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">2</button>
                           </div>
                           <div class="col-3">
                        <!-- <button type="button" class="btn btn-light w-100 mt-2 border">1</button> -->
                          <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">3</button>
                        </div>
                        <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">2</button> -->
                          <button type="button" class="btn btn-calc btn-neon-operator w-100 mt-2">×</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">3</button> -->
                           <button type="button" class="btn btn-calc btn-neon-number w-100 mt-2">0</button>
                           </div>
                            <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">-</button> -->
                          <button type="button" class="btn btn-calc btn-neon-operator w-100 mt-2">.</button>
                           </div>
                           <div class="col-3">
                        <!-- <button type="button" class="btn btn-light w-100 mt-2 border">0</button> -->
                         <button type="button" class="btn btn-calc btn-neon-equals w-100 mt-2">=</button>
                        </div>
                        <div class="col-3">
                         <!-- <button type="button" class="btn btn-light w-100 mt-2 border">.</button> -->
                           <button type="button" class="btn btn-calc btn-neon-operator w-100 mt-2">÷</button>
                           </div>
                            

                        
<!-- NEW Dropdown Button for Scientific Functions, moved here -->
                            <div class="col-12">
                                <div class="dropdown w-100 mt-2">
                                    <button class="btn btn-neon-function dropdown-toggle w-100" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                        More
                                    </button>
                                    <div class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropdownMenuButton">
                                        <div class="row gx-1 px-2">
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2"> ( </button></div>
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2"> ) </button></div>
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">sin</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">ln</button></div>
                                        </div>
                                        <div class="row gx-1 px-2">
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">π</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">cos</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">log</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">e</button></div>
                                        </div>
                                        <div class="row gx-1 px-2">
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">tan</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">√</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">asin</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">acos</button></div>
                                        </div>
                                        <div class="row gx-1 px-2">
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">atan</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-calc btn-neon-function w-100 mt-2">!</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">x²</button></div>
                                            <div class="col-3"><button type="button" class="btn btn-neon-function w-100 mt-2">x^y</button></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                    </div>
                    </div>
                    </div>
                    </div>
                    
                    </div>
                    
                  </div>
                  
                
            </div>
            </div>
           </div>
        </div>
    </div>


     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"> </script>
       <script src="script.js">
 </script>     
</body>
</html>
